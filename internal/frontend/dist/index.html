<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tayga Mail Server</title>
  <style>
    :root {
      --forest: #2D5A27;
      --earth: #6B4F3A;
      --spray: #FF6B35;
      --stone: #F5F5F0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,107,53,.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(45,90,39,.2), transparent 45%),
        var(--stone);
      color: var(--earth);
    }
    main { text-align: center; padding: 2rem; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      margin: 0 0 .5rem;
      color: var(--forest);
      letter-spacing: .02em;
    }
    p { margin: 0; opacity: .85; }
    .tag {
      display: inline-block;
      margin-top: 1.25rem;
      padding: .35rem .9rem;
      border: 2px solid var(--spray);
      color: var(--spray);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Tayga Mail</h1>
    <p>Mail server is running. Web UI arrives in a later milestone.</p>
    <span class="tag">street art + nature</span>
  </main>
</body>
</html>
