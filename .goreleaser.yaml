version: 2

project_name: tayga-mail

before:
  hooks:
    - go mod tidy

builds:
  - id: tayga-mail
    main: ./cmd/tayga
    binary: tayga-mail
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tayga/tms/internal/version.Version={{.Version}}
      - -X github.com/tayga/tms/internal/version.Commit={{.ShortCommit}}
      - -X github.com/tayga/tms/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - configs/tayga.example.yaml
      - deploy/systemd/tayga.service
      - docs/setup.md
      - docs/ha.md
      - docs/ha-single-site.md
      - docs/ha-two-sites.md
      - deploy/ha/*
      - docs/setup-filters.md
      - docs/web-omemo.md
      - docs/xmpp.md
      - docs/xmpp-*.md
      - docs/files-and-office.md
      - docs/external-mail.md
      - docs/mail-delivery-logs.md
      - docs/travel-tickets.md
      - docs/calendar-scheduling.md
      - docs/roadmap.md
      - docs/organization-directory.md
      - docs/migration.md
      - docs/product-comparison.md
      - docs/mail-dlp.md
      - docs/outlook-gal.md
      - frontend/LICENSE
      - frontend/package*.json
      - frontend/build-*.cjs
      - frontend/src/*
      - internal/frontend/dist/assets/libomemo-LICENSE.txt
      - docs/release-*.md
      - internal/flowsync/LICENSE
      - internal/flowsync/NOTICE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
