version: 2

project_name: tayga-mail

before:
  hooks:
    - go mod tidy

builds:
  - id: tayga-mail
    main: ./cmd/tayga
    binary: tayga-mail
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tayga/tms/internal/version.Version={{.Version}}
      - -X github.com/tayga/tms/internal/version.Commit={{.ShortCommit}}
      - -X github.com/tayga/tms/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - README.en.md
      - configs/tayga.example.yaml
      - deploy/systemd/tayga.service
      - deploy/systemd/update-binary.sh
      - deploy/packages/*
      - deploy/ha/*
      - docs/*.md
      - scripts/mattermost/*.py
      - docs/screenshots/*.png
      - docs/screenshots/*.md
      - docs/screenshots/*.txt
      - docs/screenshots/v1.0.0/*
      - docs/screenshots/v1.0.1/*
      - docs/screenshots/v1.0.2/*
      - docs/screenshots/v1.0.4/*
      - docs/screenshots/v1.0.5/*
      - frontend/LICENSE
      - frontend/README.md
      - frontend/package*.json
      - frontend/build-*.cjs
      - frontend/src/*
      - frontend/assets/*
      - internal/frontend/dist/assets/libomemo-LICENSE.txt
      - internal/frontend/dist/assets/ckeditor5/LICENSE.md
      - internal/frontend/dist/assets/ckeditor5/COPYING.GPL
      - internal/imapwire/LICENSE
      - internal/flowsync/LICENSE
      - internal/flowsync/NOTICE
      - internal/flowsync/UNICODE-LICENSE.txt

nfpms:
  - id: linux
    ids: [tayga-mail]
    package_name: tayga-mail
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Tayga Mail
    homepage: https://github.com/rkislov/tayga-mail-server
    maintainer: Tayga Mail maintainers <rkislov@users.noreply.github.com>
    description: |
      Self-hosted mail and collaboration server / Почтовый сервер для своей инфраструктуры.
      Webmail, calendars, contacts, files, chat, administration and mail security integrations.
    license: GPL-3.0-only
    formats: [deb, rpm]
    bindir: /usr/bin
    section: mail
    priority: optional
    dependencies: [ca-certificates, systemd, logrotate]
    overrides:
      rpm:
        dependencies: [ca-certificates, systemd, logrotate, /usr/sbin/useradd, /usr/sbin/groupadd]
    deb:
      compression: gzip
      predepends: [passwd]
    rpm:
      compression: gzip
      group: System/Servers
    scripts:
      preinstall: deploy/packages/scripts/preinstall.sh
      postinstall: deploy/packages/scripts/postinstall.sh
      preremove: deploy/packages/scripts/preremove.sh
      postremove: deploy/packages/scripts/postremove.sh
    contents:
      - dst: /etc/tayga
        type: dir
        file_info:
          mode: 0750
          owner: root
          group: tayga
      - src: deploy/packages/tayga.yaml
        dst: /etc/tayga/tayga.yaml
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: tayga
      - src: deploy/packages/tayga.service
        dst: /usr/lib/systemd/system/tayga.service
      - src: deploy/packages/logrotate
        dst: /etc/logrotate.d/tayga-mail
        type: config|noreplace
      - src: LICENSE
        dst: /usr/share/licenses/tayga-mail/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/tayga-mail/NOTICE
      - src: docs/linux-packages.md
        dst: /usr/share/doc/tayga-mail/linux-packages.md
      - src: docs/admin-guide.md
        dst: /usr/share/doc/tayga-mail/admin-guide.md
      - src: docs/domain-admin-guide.md
        dst: /usr/share/doc/tayga-mail/domain-admin-guide.md
      - src: docs/user-guide.md
        dst: /usr/share/doc/tayga-mail/user-guide.md
      - src: docs/mattermost-agents.md
        dst: /usr/share/doc/tayga-mail/mattermost-agents.md
      - src: docs/mattermost-products.md
        dst: /usr/share/doc/tayga-mail/mattermost-products.md
      - src: scripts/mattermost/provision-product-db.py
        dst: /usr/share/tayga-mail/mattermost/provision-product-db.py
      - src: scripts/mattermost/restore-product-dbs.py
        dst: /usr/share/tayga-mail/mattermost/restore-product-dbs.py
      - src: docs/release-1.3.0.md
        dst: /usr/share/doc/tayga-mail/release-notes.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
