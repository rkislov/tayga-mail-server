name: Outlook ItemAttachment server acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/flowsync/**'
      - 'internal/storage/**'
      - 'scripts/check-outlook-itemattachments.py'
      - 'docs/outlook-itemattachment-acceptance.md'
      - '.github/workflows/outlook-itemattachments.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
jobs:
  isolated-server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check required server scenarios
        run: python3 scripts/check-outlook-itemattachments.py --output "$RUNNER_TEMP/outlook-itemattachments.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outlook-itemattachment-server-report
          path: ${{ runner.temp }}/outlook-itemattachments.json
          if-no-files-found: warn
          retention-days: 14
