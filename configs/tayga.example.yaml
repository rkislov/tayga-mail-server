# Tayga Mail Server — example configuration (local development)

server:
  hostname: mail.example.com

storage:
  driver: sqlite # sqlite | postgres
  sqlite:
    path: ./data/tayga.db
  postgres:
    dsn: "postgres://tayga:tayga@localhost:5432/tayga?sslmode=disable"

mailstore:
  root: ./data/maildir

smtp:
  # Non-privileged ports for local development
  mx: ":1025"
  submission: ":1587"
  smtps: "" # e.g. ":1465" when TLS certs are set
  max_size: 26214400 # 25 MiB
  read_timeout: 60s
  write_timeout: 60s

imap:
  listen: ":1143"
  imaps: ""

pop3:
  listen: ":1110"
  pop3s: ""

managesieve:
  listen: ":14190"

# Per-domain LDAP (hybrid with local users). Disabled by default.
ldap:
  cache_ttl: 5m
  domains:
    # example.com:
    #   enabled: true
    #   url: "ldap://127.0.0.1:1389"
    #   start_tls: false
    #   bind_dn: "cn=admin,dc=example,dc=com"
    #   bind_password: "secret"
    #   base_dn: "ou=people,dc=example,dc=com"
    #   filter: "(&(objectClass=inetOrgPerson)(mail={email}))"
    #   attr_email: mail
    #   attr_name: cn
    #   timeout: 10s

# Per-domain OpenID Connect (authorization code). Disabled by default.
oidc:
  domains:
    # example.com:
    #   enabled: true
    #   issuer: "https://login.example.com"
    #   client_id: "tayga"
    #   client_secret: "secret"
    #   redirect_url: "http://127.0.0.1:8080/api/v1/auth/oidc/callback"
    #   scopes: [openid, email, profile]

# MFA / opaque tokens for XOAUTH2 & OAUTHBEARER on IMAP/SMTP
mfa:
  issuer: "Tayga Mail"
  access_token_ttl: 1h
  refresh_token_ttl: 720h
  challenge_ttl: 5m
  # When true, users with TOTP enabled cannot use password on IMAP/SMTP/POP3.
  require_token_for_mfa_users: true

tls:
  cert_file: ""
  key_file: ""

http:
  listen: ":8080"
  public_url: "http://127.0.0.1:8080"
  # CalDAV:  /dav/cal/{email}/calendars/default/
  # CardDAV: /dav/card/{email}/addressbooks/default/
  # Discovery: /.well-known/caldav | /.well-known/carddav

seed:
  enabled: true
  tenant: default
  domain: example.com
  email: admin@example.com
  password: changeme
  name: Admin

log:
  level: info
  format: json
