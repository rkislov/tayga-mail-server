# Tayga Mail Server — bootstrap configuration (minimal).
# Operational settings (spam, DMARC, outbound, LDAP, listeners overrides, …)
# are stored in the database and edited in Admin → Server settings.
# Standard ports (<1024) need root or CAP_NET_BIND_SERVICE.

server:
  hostname: mail.example.com

storage:
  driver: sqlite # sqlite | postgres
  sqlite:
    path: ./data/tayga.db
  postgres:
    # Shared DSN also enables cross-node IMAP IDLE (LISTEN/NOTIFY tayga_idle).
    dsn: "postgres://tayga:tayga@localhost:5432/tayga?sslmode=disable"

mailstore:
  root: ./data/maildir

# Optional first-boot seed (or set via Admin → Server settings → seed, then restart):
seed:
  enabled: true
  tenant: default
  domain: example.com
  email: admin@example.com
  password: changeme
  name: Administrator

# Optional emergency overrides (also in Admin UI; restart to apply):
# http:
#   listen: ":80"
#   tls_listen: ":443"
#   public_url: "https://mail.example.com"
#   admins: ["admin@example.com"]
# xmpp:
#   enabled: false
#   listen: ":5222"
#   listen_tls: ":5223"
#   require_tls: true
#   component_listen: ":5347"
#   components:
#     - name: support-bot
#       subdomain: bots
#       secret: change-me-component-secret
log:
  level: info
  format: json
  file: ./data/tayga.log # required — always written (also mirrored to stdout)

# Optional SIEM export (also Admin → Server → siem; restart to apply):
# siem:
#   enabled: true
#   protocol: udp # udp | tcp | tls
#   address: "siem.example.com:514"
#   facility: local0
#   format: cef
# tls:
#   cert_file: ./data/certs/server.crt
#   key_file: ./data/certs/server.key
#   certs_dir: ./data/certs/store
#   auto_generate: true
#   acme:
#     email: admin@example.com
#     staging: false
