# Tayga Mail Server — example configuration
# Standard ports (<1024) need root or CAP_NET_BIND_SERVICE.

server:
  hostname: mail.example.com

storage:
  driver: sqlite # sqlite | postgres
  sqlite:
    path: ./data/tayga.db
  postgres:
    # Shared DSN also enables cross-node IMAP IDLE (LISTEN/NOTIFY tayga_idle).
    dsn: "postgres://tayga:tayga@localhost:5432/tayga?sslmode=disable"

mailstore:
  root: ./data/maildir
  # Optional S3-compatible write-through mirror (local maildir stays hot cache).
  object_store:
    enabled: false
    endpoint: "http://127.0.0.1:9000"
    region: us-east-1
    bucket: tayga-mail
    access_key: minio
    secret_key: minio123
    prefix: "maildir/"
    path_style: true   # MinIO / path-style; set false for virtual-hosted AWS
    # sync_interval: 1h  # optional in-process reconcile (0/omit = use cron + sync-objects)

smtp:
  mx: ":25"
  submission: ":587"   # STARTTLS when tls certs are present
  smtps: ":465"        # implicit TLS
  max_size: 26214400 # 25 MiB
  read_timeout: 60s
  write_timeout: 60s
  # Outbound for authenticated submission to external recipients
  relay:
    host: "" # e.g. "smtp.example.com:587"
    username: ""
    password: ""
    # disable_starttls: false
  dkim:
    enabled: false
    domain: example.com
    selector: tayga
    private_key_file: ./data/dkim/private.pem

imap:
  listen: ":143"       # STARTTLS when tls certs are present
  imaps: ":993"        # implicit TLS

pop3:
  listen: ":110"       # STLS when tls certs are present
  pop3s: ":995"        # implicit TLS

managesieve:
  listen: ":4190"      # STARTTLS when tls certs are present

# Per-domain LDAP (hybrid with local users). Disabled by default.
ldap:
  cache_ttl: 5m
  domains:
    # example.com:
    #   enabled: true
    #   url: "ldap://127.0.0.1:1389"
    #   start_tls: false
    #   bind_dn: "cn=admin,dc=example,dc=com"
    #   bind_password: "secret"
    #   base_dn: "ou=people,dc=example,dc=com"
    #   filter: "(&(objectClass=inetOrgPerson)(mail={email}))"
    #   attr_email: mail
    #   attr_name: cn
    #   timeout: 10s

# Per-domain OpenID Connect (authorization code). Disabled by default.
oidc:
  domains:
    # example.com:
    #   enabled: true
    #   issuer: "https://login.example.com"
    #   client_id: "tayga"
    #   client_secret: "secret"
    #   redirect_url: "https://mail.example.com/api/v1/auth/oidc/callback"
    #   scopes: [openid, email, profile]

# HA fencing for MX (requires postgres). Standby returns 421 on unauthenticated MAIL.
ha:
  mode: none # none | active_standby
  lease_ttl: 5s

# FlowSync — original Tayga sync engine (ActiveSync- and EWS-compatible wire; Apache-2.0)
flowsync:
  enabled: true

# MFA / opaque tokens for XOAUTH2 & OAUTHBEARER on IMAP/SMTP
mfa:
  issuer: "Tayga Mail"
  access_token_ttl: 1h
  refresh_token_ttl: 720h
  challenge_ttl: 5m
  # When true, users with TOTP/WebAuthn cannot use password on IMAP/SMTP/POP3.
  require_token_for_mfa_users: true
  webauthn:
    enabled: true
    # rp_id / rp_origins default from http.public_url host
    # rp_display_name: "Tayga Mail"
    # rp_id: "mail.example.com"
    # rp_origins: ["https://mail.example.com"]

tls:
  cert_file: ./data/certs/server.crt
  key_file: ./data/certs/server.key
  # Dev only: create a self-signed cert if files are missing
  auto_generate: true

http:
  listen: ":80"
  tls_listen: ":443"
  redirect_http_to_tls: true
  public_url: "https://mail.example.com"
  admins:
    - admin@example.com
  # CalDAV:  /dav/cal/{email}/calendars/default/
  # CardDAV: /dav/card/{email}/addressbooks/default/
  # Discovery: /.well-known/caldav | /.well-known/carddav

seed:
  enabled: true
  tenant: default
  domain: example.com
  email: admin@example.com
  password: changeme
  name: Admin

log:
  level: info
  format: json
