# Per-domain OpenID Connect (authorization code). Disabled by default.
oidc:
  domains:
    # example.com:
    #   enabled: true
    #   issuer: "https://login.example.com"
    #   client_id: "tayga"
    #   client_secret: "secret"
    #   redirect_url: "https://mail.example.com/api/v1/auth/oidc/callback"
    #   scopes: [openid, email, profile]

# HA fencing. Standby returns 421 / IMAP NO on gated writers.
ha:
  mode: none # none | active_standby | sticky
  lease_ttl: 5s
  fence: mx  # active_standby: mx | writers
  sticky_ttl: 30s
  # node_id: ""  # sticky node identity (default hostname-uuid)

# Inbound virus scan (SMTP local delivery). Requires clamd or an exec scanner.
scan:
  enabled: false
  backend: clamav          # clamav | exec | none
  action: quarantine       # reject | quarantine | tag
  quarantine_folder: Quarantine
  timeout: 30s
  fail_open: false         # true = deliver if scanner is down
  clamav:
    address: "127.0.0.1:3310"
  # exec:
  #   command: ["clamdscan", "--fdpass", "--no-summary", "-"]

# Spam scoring via Rspamd HTTP /checkv2 (after virus scan, before Sieve)
spam:
  enabled: false
  backend: rspamd          # rspamd | none
  url: "http://127.0.0.1:11333"
  # password: ""           # Rspamd controller password if required
  timeout: 10s
  fail_open: true          # true = deliver if Rspamd is down
  folder: Junk             # folder for quarantine_above action
  follow_rspamd: true      # map reject / greylist / add header from Rspamd
  # Optional score overrides (also apply when follow_rspamd is true):
  # reject_above: 15
  # quarantine_above: 6
  # tag_above: 4

# Inbound mail authentication on unauthenticated MX (before virus/spam)
# Order: SPF → DKIM → DMARC. Each may add Authentication-Results.
spf:
  enabled: false
  action: tag                # tag | reject
  fail_open: true
  # authserv_id: ""

dkim_verify:
  enabled: false
  action: tag                # tag | reject
  require_signature: false   # reject unsigned when action=reject
  fail_open: true            # temperror (DNS) → deliver with dkim=temperror
  # authserv_id: ""          # default: server.hostname (Authentication-Results)

dmarc:
  enabled: false
  action: tag                # tag | reject | follow (honor DNS p=reject)
  fail_open: true
  # authserv_id: ""
  report:
    enabled: false           # aggregate rua reports (needs outbound queue/relay)
    org_name: "Tayga Mail"
    # contact: "dmarc-noreply@mail.example.com"
    interval: 24h

# Authenticated Received Chain (RFC 8617) — after SPF/DKIM/DMARC on MX
arc:
  enabled: false
  verify: true               # Authentication-Results arc=pass|fail|none
  seal: false                # prepend ARC set (needs RSA key)
  action: tag                # tag | reject (on verify fail)
  fail_open: true
  # authserv_id: ""
  # domain: example.com
  # selector: arc
  # private_key_file: ./data/dkim/private.pem   # RSA PEM (same key as DKIM ok)

# FlowSync — original Tayga sync engine (ActiveSync- and EWS-compatible wire; Apache-2.0)
flowsync:
  enabled: true

# MFA / opaque tokens for XOAUTH2 & OAUTHBEARER on IMAP/SMTP
mfa:
  issuer: "Tayga Mail"
  access_token_ttl: 1h
  refresh_token_ttl: 720h
  challenge_ttl: 5m
  # When true, users with TOTP/WebAuthn cannot use password on IMAP/SMTP/POP3.
  require_token_for_mfa_users: true
  webauthn:
    enabled: true
    # rp_id / rp_origins default from http.public_url host
    # rp_display_name: "Tayga Mail"
    # rp_id: "mail.example.com"
    # rp_origins: ["https://mail.example.com"]

tls:
  cert_file: ./data/certs/server.crt
  key_file: ./data/certs/server.key
  # Dev only: create a self-signed cert if files are missing
  auto_generate: true

http:
  listen: ":80"
  tls_listen: ":443"
  redirect_http_to_tls: true
  public_url: "https://mail.example.com"
  admins:
    - admin@example.com
  # CalDAV:  /dav/cal/{email}/calendars/default/
  # CardDAV: /dav/card/{email}/addressbooks/default/
  # Discovery: /.well-known/caldav | /.well-known/carddav

seed:
  enabled: true
  tenant: default
  domain: example.com
  email: admin@example.com
  password: changeme
  name: Admin

log:
  level: info
  format: json
